<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkPets-Web</title>
    <style>
        * { margin: 0; padding: 0; }
        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            padding: 1.5rem 0;
            color: #2c3e50;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }
        p {
            max-width: 800px;
            margin: 1rem auto;
            padding: 0 15px;
        }
    </style>
</head>
<body>
    <h1>ArkPets-Web</h1>
    <p>Run <code>npm run build</code> and <code>npm run models -- dist</code>, then serve this directory.</p>
    <p>Drag the pet, click it, or right-click (long-press on touch screens) for the menu.</p>
    <script src="dist/arkpets.js" data-arkpets-manifest="dist/manifest.json" defer></script>
</body>
</html>
